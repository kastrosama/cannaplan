# Builds an installable test APK on every push (except gh-pages).
# The APK is published as a pre-release (one per branch, replaced on each push),
# tagged test-<branch>, with a direct .apk download link.
# NOTE: signed with the debug key - for sideloading/testing only, not for Play.
# Play builds still go through EAS (`eas build -p android --profile production`).
name: Android test APK

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK (arm64 phones)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        id: apk
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          FILE="dist/CannaPlan-${BRANCH}-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: CannaPlan-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ steps.apk.outputs.branch }}"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build: ${{ steps.apk.outputs.branch }} (${GITHUB_SHA::7})" \
            --notes "Automatic test build of \`${{ github.ref_name }}\` at ${GITHUB_SHA::7}.

          Signed with the debug key, so it's for sideloading and testing only and can't go to Google Play. Uninstall the Play Store version before installing."
