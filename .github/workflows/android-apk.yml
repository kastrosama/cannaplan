# Builds an installable test APK on every push (except gh-pages).
# Download it from the run's "Artifacts" section.
# NOTE: signed with the debug key - for sideloading/testing only, not for Play.
# Play builds still go through EAS (`eas build -p android --profile production`).
name: Android test APK

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK (arm64 phones)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/CannaPlan-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CannaPlan-apk
          path: dist/*.apk
          retention-days: 30
